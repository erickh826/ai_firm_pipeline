[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aifilm-pipeline"
version = "0.1.0"
description = "Reusable AI film pipeline: fal.ai video generation + lip sync, and MiniMax TTS dubbing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fal-client",
]

[project.scripts]
aifilm-videos = "aifilm.videos:main"
aifilm-lipsync = "aifilm.lipsync:main"
aifilm-tts = "aifilm.tts:main"

[tool.setuptools]
packages = ["aifilm"]
